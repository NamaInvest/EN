appId: com.namainvest.erp
productName: "Nama Invest ERP"
copyright: "Copyright © 2026 Nama Invest. All rights reserved."

directories:
  output: dist-electron
  buildResources: electron/assets

asar: true
asarUnpack:
  - "**/*.node"
  - "**/sharp/**"
  - "**/embedded-postgres/**"
  - "**/@embedded-postgres/**"
  - "**/electron/zatca-sdk/**"

npmRebuild: false

files:
  - "electron/**/*"
  # - ".next-electron/standalone/**/*"  <-- REMOVED to avoid 30-minute double-packing
  - ".next-electron/static/**/*"
  - "public/**/*"
  - "prisma/**/*"
  - "package.json"
  - "!node_modules/.cache"
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/ssh2/**"
  - "!**/ssh2-sftp-client/**"
  - "!**/cpu-features/**"
  - "!**/*.zip"
  - "!**/*.tar.gz"

extraResources:
  - from: "prisma"
    to: "prisma"
  - from: "electron/assets/vcredist_x64.exe"
    to: "vcredist_x64.exe"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/assets/icon.ico
  legalTrademarks: "Nama Invest ERP is a trademark of Nama Invest Technology"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/assets/icon.ico
  uninstallerIcon: electron/assets/icon.ico
  installerHeaderIcon: electron/assets/icon.ico
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Nama Invest ERP"
  artifactName: "NamaInvest-Setup-${version}.${ext}"
  perMachine: false
  include: "scripts/installer.nsh"

# Code Protection
afterPack: scripts/after-pack.js

# Auto Update — يشير لسيرفرنا لتوفير التحديثات التلقائية
# (publish section مفعّلة عند الإصدار الرسمي فقط)
publish:
  provider: generic
  url: https://namainvist.com/updates/desktop
  channel: latest
