version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: namasoft
      POSTGRES_PASSWORD: namasoft_password
      POSTGRES_DB: namasoft_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://namasoft:namasoft_password@db:5432/namasoft_db?schema=public
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NODE_ENV=production
    depends_on:
      - db
    # We should run migrations before starting the web server. 
    # Usually handled by an init script or entrypoint, but for simplicity, we can do it manually or via another container.

volumes:
  pgdata:
