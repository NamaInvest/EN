# AI-24 — GitHub Actions CI/CD Pipeline
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint
        run: npx eslint src/ --max-warnings 50

      # NOTE: TypeScript currently has known errors documented in HARDENING.md.
      # We capture the count and fail the build only if it INCREASES vs. the baseline.
      # Baseline drops as we fix legacy errors; never raise it without good reason.
      - name: TypeScript Check (baseline-aware)
        run: |
          npx tsc --noEmit --skipLibCheck 2>&1 | tee tsc-output.log || true
          ERR_COUNT=$(grep -c "error TS" tsc-output.log || echo 0)
          BASELINE=95
          echo "TypeScript errors: $ERR_COUNT (baseline: $BASELINE)"
          if [ "$ERR_COUNT" -gt "$BASELINE" ]; then
            echo "❌ TypeScript error count increased. New errors must be fixed before merge."
            exit 1
          fi
          echo "✅ TypeScript error count within baseline."

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npx vitest run --reporter=verbose

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/namasoft9-3-main
            # Snapshot current commit for rollback
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREV_COMMIT"

            git pull origin main
            npm ci --production
            npx prisma generate

            # Schema sync — additive only.
            # We use `prisma db push` (NOT `--accept-data-loss`) which:
            #   - creates new tables/columns automatically (additive: safe)
            #   - REFUSES destructive changes (dropped column/table) and exits
            #     with code 1, which `set -e` catches and triggers rollback.
            # Migration files in prisma/migrations/ are out of sync with the
            # current schema, so `migrate deploy` would no-op while leaving
            # new tables uncreated. db-push without the destructive flag is
            # the closest thing to a safe deploy until proper migrations
            # are reintroduced (tracked in HARDENING.md).
            npx prisma db push --skip-generate

            npm run build
            pm2 restart namasoft-main

            # Health check; rollback on failure
            sleep 5
            if ! curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "❌ Health check failed — rolling back to $PREV_COMMIT"
              git reset --hard "$PREV_COMMIT"
              npm ci --production
              npx prisma generate
              npm run build
              pm2 restart namasoft-main
              exit 1
            fi
            echo "✅ Deployed successfully at $(date)"
