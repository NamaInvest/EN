name: Synthetic Monitoring

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Health Check
        id: health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://namainvest.com/api/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status $response"
            exit 1
          fi

      - name: Alert on Failure
        if: failure()
        run: |
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d '{"chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}", "text": "🚨 URGENT: Synthetic monitoring failed! System might be down."}' \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage
